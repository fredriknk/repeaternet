[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rf-router-planner"
version = "0.1.0"
description = "Terrain-aware RF repeater placement planner for Norway"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "RF Router Planner contributors"}]
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
  "pyproj>=3.6",
  "rasterio>=1.3.10",
  "shapely>=2.0",
  "scipy>=1.12",
  "requests>=2.31",
  "PySide6>=6.7",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rf-router-planner = "rf_router_planner.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_router_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
