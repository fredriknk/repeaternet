[package]
name = "repeaternet-project-store"
version = "0.1.0"
edition = "2021"
description = "Workspace-scoped RepeaterNet SQLite catalog and project files"

[dependencies]
getrandom = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
