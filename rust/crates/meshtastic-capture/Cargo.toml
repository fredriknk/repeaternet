[package]
name = "meshtastic-capture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
getrandom = "0.4"
glob = "0.3"
httpdate = "1"
repeaternet-providers = { path = "../providers" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "query", "rustls-no-provider", "system-proxy"] }
robotstxt = "0.3"
rusqlite = { version = "0.43", features = ["bundled", "functions"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sondehub-import = { path = "../sondehub-import" }
tokio = { version = "1", features = ["net", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
