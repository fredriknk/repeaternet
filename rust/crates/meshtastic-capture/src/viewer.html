<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Measured links · RepeaterNet</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/leaflet.css">
  <style>
    :root { color-scheme: light; font: 14px/1.45 system-ui, sans-serif; color: #172d28; background: #f1f5f1; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #153a32; color: #fff; padding: .75rem 1.25rem; display: flex; gap: .5rem 1.5rem; align-items: baseline; flex-wrap: wrap; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.45rem; }
    h2 { font-size: 1.05rem; }
    [hidden] { display: none !important; }
    #status { color: #dbebe3; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(255px, 315px); gap: .75rem; padding: .75rem; }
    form, .map-panel, aside { background: #fff; border: 1px solid #ccd8d1; border-radius: .6rem; min-width: 0; }
    form { grid-column: 1/-1; display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); align-items: end; gap: .6rem; padding: .75rem; }
    label { display: grid; gap: .2rem; min-width: 0; font-weight: 600; }
    select { width: 100%; min-height: 36px; font: inherit; color: inherit; background: #fff; border: 1px solid #8ba199; border-radius: .35rem; padding: .3rem; }
    .check { display: flex; min-height: 36px; gap: .45rem; align-items: center; }
    :focus-visible { outline: 3px solid #166cc1; outline-offset: 2px; }
    #map { height: max(320px, calc(100vh - 334px)); border-radius: .55rem .55rem 0 0; background: #e2e9e4; }
    .legend { display: flex; align-items: center; flex-wrap: wrap; gap: .3rem 1rem; padding: .55rem .75rem; font-size: .9rem; }
    .legend span { white-space: nowrap; }
    .sample { display: inline-block; width: 1.5rem; margin-right: .35rem; border-top: 3px var(--style, solid) var(--line); vertical-align: middle; }
    aside { padding: .75rem; max-height: calc(100vh - 150px); overflow: auto; }
    article { padding: .55rem 0; border-top: 1px solid #dce4de; }
    article:first-child { margin-top: .45rem; }
    article strong { overflow-wrap: anywhere; }
    .muted { color: #466059; font-size: .875rem; }
    dl { display: grid; grid-template-columns: 1fr auto; margin: .3rem 0 0; gap: .1rem .5rem; font-size: .9rem; }
    dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    .inspect { padding: 0 .75rem .6rem; max-width: 36rem; }
    .link-details { max-width: min(290px, 72vw); overflow-wrap: anywhere; }
    .leaflet-control-zoom a { min-width: 36px; min-height: 36px; line-height: 36px; }
    @media (max-width: 740px) {
      main { grid-template-columns: minmax(0, 1fr); }
      aside { max-height: none; }
      header { padding: .6rem .85rem; }
      #map { height: max(320px, 42vh); }
      select, .check, .leaflet-control-zoom a { min-height: 44px; }
      .leaflet-control-zoom a { min-width: 44px; line-height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Measured links</h1>
    <p id="status" role="status">Reading capture files…</p>
  </header>
  <main>
    <form aria-label="Link filters">
      <label>Network<select id="network"><option value="">All networks</option></select></label>
      <label>Source host<select id="host"><option value="">All hosts</option></select></label>
      <label>Band or region<select id="band"><option value="">All bands</option></select></label>
      <label>Modem preset<select id="preset"><option value="">All presets</option></select></label>
      <label>Evidence<select id="evidence"><option value="">All evidence</option></select></label>
      <label>Time window<select id="window"><option value="day">Last day</option><option value="week">Last week</option><option value="all">All time</option></select></label>
      <label>Radiosonde AGL<select id="agl"><option value="">All heights</option><option value="1000">Below 1,000 m</option><option value="3000">Below 3,000 m</option></select></label>
      <label class="check"><input id="precision" type="checkbox">Hide coarse positions</label>
      <label class="check"><input id="suspect" type="checkbox" checked>Hide suspect links</label>
    </form>
    <section class="map-panel" aria-label="Measured links map">
      <div id="map" aria-label="Map of located links"></div>
      <div id="lora-legend" class="legend" aria-label="LoRa signal legend">
        <strong>LoRa mean SNR · dB</strong>
        <span><i class="sample" style="--line:#087c48"></i>≥ 5</span>
        <span><i class="sample" style="--line:#006fa8"></i>0 to &lt; 5</span>
        <span><i class="sample" style="--line:#9c5800;--style:dashed"></i>−5 to &lt; 0</span>
        <span><i class="sample" style="--line:#b1303a;--style:dashed"></i>&lt; −5</span>
        <span><i class="sample" style="--line:#55666a;--style:dotted"></i>Unavailable</span>
      </div>
      <div id="sonde-snr-legend" class="legend" aria-label="Radiosonde decoder SNR legend" hidden>
        <strong>Auto RX mean demodulator SNR · dB</strong>
        <span><i class="sample" style="--line:#6338a3"></i>≥ 20</span>
        <span><i class="sample" style="--line:#9058b6;--style:dashed"></i>10 to &lt; 20</span>
        <span><i class="sample" style="--line:#765286;--style:dotted"></i>&lt; 10</span>
      </div>
      <div id="sonde-rssi-legend" class="legend" aria-label="Radiosonde receiver RSSI legend" hidden>
        <strong>rdzTTGO mean RSSI · dBm</strong>
        <span><i class="sample" style="--line:#005b60"></i>≥ −95</span>
        <span><i class="sample" style="--line:#27777b;--style:dashed"></i>−115 to &lt; −95</span>
        <span><i class="sample" style="--line:#53686a;--style:dotted"></i>&lt; −115</span>
      </div>
      <label class="inspect">Inspect busiest links<select id="inspect"><option value="">Choose a link</option></select></label>
    </section>
    <aside aria-labelledby="sources-heading">
      <h2 id="sources-heading">Capture totals</h2>
      <p class="muted">All time · refreshes every minute</p>
      <p id="storage" class="muted"></p>
      <div id="sources"></div>
    </aside>
  </main>
  <script src="/leaflet.js"></script>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    const form = document.querySelector('form');
    const map = L.map('map', { preferCanvas: true }).setView([40, 5], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    const layer = L.layerGroup().addTo(map);
    const evidence = {
      gateway_rx: 'Gateway reception', traceroute_towards: 'Traceroute towards',
      traceroute_back: 'Traceroute back', neighbor: 'Neighbour report',
      sonde_snr_auto_rx: 'Radiosonde Auto RX SNR', sonde_rssi_rdz: 'Radiosonde rdzTTGO RSSI'
    };
    const number = new Intl.NumberFormat();
    const clock = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    const date = value => value == null ? '—' : clock.format(value * 1000);
    const metric = (value, unit) => value == null ? 'Unavailable' : value.toFixed(1) + ' ' + unit;
    const code = value => value ?? 'Unknown';
    let data;
    let pending;
    let refreshTimer;
    let fitted = false;
    let inspected = new Map();
    let sonde = { links: [], total: 0 };
    let sondeRequest;
    let sondeTimer;
    let sondeLoading = false;
    let sondeError = false;
    let inspectionPopup;
    const sondeKind = kind => kind.startsWith('sonde_');
    const isSonde = link => sondeKind(link.evidence);
    const value = id => byId(id).value;
    const matches = (id, actual) => !value(id) || value(id) === actual;
    const sourceMatches = source => matches('network', source.network) && matches('host', source.host);
    const gb = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });

    function options(id, values, label = value => value) {
      const select = byId(id);
      const selected = select.value;
      const priorLabel = select.selectedOptions[0]?.text;
      const items = new Map(Array.from(new Set(values)).sort().map(value => [value, label(value)]));
      if (selected && !items.has(selected) && id !== 'inspect') items.set(selected, priorLabel);
      select.replaceChildren(select.options[0], ...Array.from(items, ([value, text]) => new Option(text, value)));
      if (items.has(selected)) select.value = selected;
    }

    function fields(entries) {
      const list = document.createElement('dl');
      for (const [name, value] of entries) {
        const term = document.createElement('dt');
        term.textContent = name;
        const detail = document.createElement('dd');
        detail.textContent = value;
        list.append(term, detail);
      }
      return list;
    }

    function showSources(sources) {
      byId('storage').textContent = gb.format(data.database_bytes / 1e9) + ' of '
        + gb.format(data.budget_bytes / 1e9) + ' GB across capture files';
      const cards = sources.map(source => {
        const card = document.createElement('article');
        const name = document.createElement('strong');
        name.textContent = source.host;
        const network = document.createElement('p');
        network.className = 'muted';
        network.textContent = source.network;
        card.append(name, network, fields([
          ['Measurements', number.format(source.measurements)], ['Located links', number.format(source.located_links)],
          [source.network === 'Radiosonde' ? 'Distinct receivers' : 'Distinct nodes', number.format(source.nodes)], ['Last update', date(source.last_update)]
        ]));
        return card;
      });
      byId('sources').replaceChildren(...cards);
    }

    function style(link) {
      if (link.evidence === 'sonde_snr_auto_rx') {
        if (link.snr >= 20) return { color: '#6338a3' };
        if (link.snr >= 10) return { color: '#9058b6', dashArray: '6 3' };
        return { color: '#765286', dashArray: '1 4' };
      }
      if (link.evidence === 'sonde_rssi_rdz') {
        if (link.rssi >= -95) return { color: '#005b60' };
        if (link.rssi >= -115) return { color: '#27777b', dashArray: '6 3' };
        return { color: '#53686a', dashArray: '1 4' };
      }
      const snr = link.snr;
      if (snr == null) return { color: '#55666a', dashArray: '1 4' };
      if (snr >= 5) return { color: '#087c48' };
      if (snr >= 0) return { color: '#006fa8' };
      if (snr >= -5) return { color: '#9c5800', dashArray: '6 3' };
      return { color: '#b1303a', dashArray: '3 3' };
    }

    function details(link, full, tooltip = false) {
      const node = document.createElement('div');
      node.className = 'link-details';
      const title = document.createElement('strong');
      const sondeLink = isSonde(link);
      title.textContent = sondeLink
        ? (tooltip ? link.tx + ' → ' + link.rx : evidence[link.evidence])
        : (full ? link.tx + ' → ' + link.rx : evidence[link.evidence]);
      const rows = sondeLink
        ? [[link.snr == null ? 'Mean receiver RSSI' : 'Mean demodulator SNR', signalLabel(link)],
           ['Balloon AGL', metric(link.agl, 'm')]]
        : [['Mean SNR', metric(link.snr, 'dB')], ['Mean RSSI', metric(link.rssi, 'dBm')]];
      if (full) {
        rows.push(['Source', data.sources[link.source].host], ['Band or region', code(link.band)],
          ['Measurements', number.format(link.count)], ['Last seen', date(link.last)]);
        if (!sondeLink) rows.push(['Evidence', evidence[link.evidence]], ['Preset', code(link.preset)],
          ['Position precision', link.coarse ? 'Coarse' : link.unknown_precision ? 'Unknown' : '≤ 100 m']);
      }
      node.append(title, fields(rows));
      if (sondeLink && link.quality_flags && (full || tooltip)) {
        const flags = ['Path over 800 km', 'Receiver moved', 'Balloon below terrain', 'SNR at least 60 dB',
          'Balloon altitude datum unknown', 'Terrain unavailable', 'Receiver altitude datum unknown', 'RSSI at receiver floor'];
        const note = document.createElement('p');
        note.textContent = flags.filter((_, bit) => link.quality_flags & (1 << bit)).join(' · ');
        node.append(note);
      }
      if (!sondeLink && full && link.suspect) {
        const note = document.createElement('p');
        note.textContent = 'Suspect: includes neighbour reports with zero SNR, firmware older than 2.3.2 or endpoints over 300 km apart.';
        node.append(note);
      }
      return node;
    }

    function endpoints(link) {
      const [lat, lon] = link.to;
      const offset = lon - link.from[1];
      const wrap = isSonde(link) ? 360 * Math.round((map.getCenter().lng - link.from[1]) / 360) : 0;
      return [[link.from[0], link.from[1] + wrap], [lat, lon + wrap - 360 * Math.round(offset / 360)]];
    }

    function signalLabel(link) {
      return link.evidence === 'sonde_rssi_rdz' ? metric(link.rssi, 'dBm') : metric(link.snr, 'dB');
    }

    function draw() {
      if (!data) return;
      const local = data.links.filter(link => sourceMatches(data.sources[link.source])
        && matches('band', code(link.band)) && matches('preset', code(link.preset))
        && matches('evidence', link.evidence) && (!byId('precision').checked || !link.coarse)
        && (!byId('suspect').checked || !link.suspect));
      const source = data.sources.findIndex(source => source.network === 'Radiosonde');
      const links = local.concat(sonde.links.map(link => ({ ...link, source })))
        .sort((a, b) => b.count - a.count).slice(0, 15_000);
      layer.clearLayers();
      const bounds = L.latLngBounds();
      for (const link of links) {
        const points = endpoints(link);
        if (!isSonde(link)) bounds.extend(points);
        L.polyline(points, { ...style(link), weight: 1.5, opacity: .82 })
          .bindTooltip(() => details(link, false, true))
          .bindPopup(() => details(link, true)).addTo(layer);
      }
      if (!fitted && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [18, 18], maxZoom: 10, animate: false });
        fitted = true;
      }
      const busiest = links.slice(0, 50);
      inspected = new Map(busiest.map((link, index) => [String(index + 1).padStart(2, '0'), link]));
      options('inspect', Array.from(inspected.keys()), key => {
        const link = inspected.get(key);
        return link.count + ' samples · ' + data.sources[link.source].host + ' · ' + signalLabel(link);
      });
      byId('inspect').value = '';
      showSources(data.sources.filter(sourceMatches));
      byId('lora-legend').hidden = !links.some(link => !isSonde(link));
      byId('sonde-snr-legend').hidden = !links.some(link => link.evidence === 'sonde_snr_auto_rx');
      byId('sonde-rssi-legend').hidden = !links.some(link => link.evidence === 'sonde_rssi_rdz');
      const warnings = data.warnings.length ? ' · ' + data.warnings.join(' · ') : '';
      const total = sonde.total + local.length;
      let summary = !data.sources.length ? 'No capture files found'
        : total ? 'Showing ' + number.format(links.length) + ' of ' + number.format(total) + ' link groups'
          : 'No located links match these filters';
      if (sondeLoading) summary += ' · Reading radiosonde links…';
      else if (sondeError) summary += ' · Could not load radiosonde links';
      else if (!sonde.total && sondeEnabled() && value('window') === 'day') {
        summary += ' · The radiosonde archive can lag. Try Last week.';
      }
      byId('status').textContent = summary + warnings;
    }

    function sondeEnabled() {
      return data?.sources.some(source => source.network === 'Radiosonde' && sourceMatches(source))
        && matches('band', '400 MHz') && matches('preset', 'Unknown')
        && (!value('evidence') || sondeKind(value('evidence')));
    }

    async function refreshSondes() {
      clearTimeout(sondeTimer);
      sondeRequest?.abort();
      sondeRequest = null;
      sonde = { links: [], total: 0 };
      sondeError = false;
      sondeLoading = sondeEnabled();
      draw();
      if (!sondeLoading) return;
      const request = new AbortController();
      sondeRequest = request;
      const bounds = map.getBounds();
      const params = new URLSearchParams({
        west: bounds.getWest(), east: bounds.getEast(), south: bounds.getSouth(), north: bounds.getNorth(),
        window: value('window'), hide_suspect: byId('suspect').checked
      });
      if (value('evidence')) params.set('evidence', value('evidence'));
      if (value('agl')) params.set('agl', value('agl'));
      try {
        const response = await fetch('/api/sondes?' + params, { signal: request.signal });
        if (!response.ok) throw new Error('Radiosonde query returned HTTP ' + response.status);
        const result = await response.json();
        if (sondeRequest === request) sonde = result;
      } catch (error) {
        if (sondeRequest === request && error.name !== 'AbortError') sondeError = true;
      } finally {
        if (sondeRequest === request) {
          sondeRequest = null;
          sondeLoading = false;
          draw();
        }
      }
    }

    async function refresh() {
      if (pending) pending.abort();
      clearTimeout(refreshTimer);
      const request = new AbortController();
      pending = request;
      try {
        const response = await fetch('/api/links?' + new URLSearchParams({ window: byId('window').value }), { signal: request.signal });
        if (!response.ok) throw new Error('Viewer returned HTTP ' + response.status);
        data = await response.json();
        options('network', data.sources.map(source => source.network));
        options('host', data.sources.map(source => source.host));
        const hasSonde = data.sources.some(source => source.network === 'Radiosonde');
        options('band', data.links.map(link => code(link.band)).concat(hasSonde ? ['400 MHz'] : []));
        options('preset', data.links.map(link => code(link.preset)).concat(hasSonde ? ['Unknown'] : []));
        options('evidence', Object.keys(evidence), key => evidence[key]);
        refreshSondes();
      } catch (error) {
        if (error.name !== 'AbortError') byId('status').textContent = 'Could not refresh capture files. Retrying in one minute.';
      } finally {
        if (pending === request) {
          pending = null;
          refreshTimer = setTimeout(refresh, 60_000);
        }
      }
    }

    form.addEventListener('submit', event => event.preventDefault());
    form.addEventListener('change', event => {
      map.closePopup();
      if (event.target.id === 'window') refresh();
      else refreshSondes();
    });
    map.on('moveend', () => {
      clearTimeout(sondeTimer);
      if (sondeEnabled()) sondeTimer = setTimeout(refreshSondes, 220);
    });
    byId('inspect').addEventListener('change', event => {
      const link = inspected.get(event.target.value);
      if (!link) return;
      const points = endpoints(link);
      map.fitBounds(points, { padding: [24, 24], maxZoom: 12 });
      const popup = L.popup({ autoPan: false, closeOnEscapeKey: false })
        .setLatLng(L.latLngBounds(points).getCenter()).setContent(details(link, true));
      inspectionPopup = popup;
      popup.once('remove', () => {
        if (inspectionPopup === popup) inspectionPopup = null;
        if (document.activeElement === document.body) byId('inspect').focus({ preventScroll: true });
      });
      popup.openOn(map);
      popup.getElement().querySelector('.leaflet-popup-close-button').focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (inspectionPopup) {
        map.closePopup(inspectionPopup);
        byId('inspect').focus({ preventScroll: true });
      } else {
        map.closePopup();
      }
    });
    refresh();
  </script>
</body>
</html>
