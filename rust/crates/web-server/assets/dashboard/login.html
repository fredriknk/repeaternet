<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RepeaterNet · Sign in</title>
  <style>
    body { margin: 0; padding: 16px; box-sizing: border-box; min-height: 90vh; display: grid; place-items: center; font: 16px system-ui; background: #edf1ed; color: #243b3a; }
    form { box-sizing: border-box; width: min(100%, 360px); padding: 24px; border-radius: 16px; background: white; }
    h1 { margin-top: 0; }
    input, button { font: inherit; }
    input[type="password"] { display: block; box-sizing: border-box; width: 100%; min-height: 44px; margin-top: 4px; }
    .remember { display: flex; align-items: center; gap: 8px; min-height: 44px; margin: 8px 0; }
    button { min-height: 44px; padding: 0 16px; }
    :focus-visible { outline: 2px solid #17644e; outline-offset: 2px; }
  </style>
</head>
<body>
  <form action="/login" method="post">
    <h1>RepeaterNet</h1>
    <p>Enter your server access token.</p>
    <label>Access token <input name="token" type="password" required autocomplete="current-password"></label>
    <label class="remember"><input name="remember" type="checkbox" value="1"> Keep me signed in for 30 days</label>
    <button>Sign in</button>
  </form>
</body>
</html>
