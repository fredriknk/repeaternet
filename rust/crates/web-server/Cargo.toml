[package]
name = "repeaternet"
version = "0.4.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
repeaternet-providers = { path = "../providers" }
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4.5", features = ["derive", "env"] }
geo = { version = "0.33.1", default-features = false }
getrandom = "0.4"
lru = "0.19"
open = "5"
repeaternet-coverage-store = { path = "../coverage-store" }
repeaternet-exports = { path = "../exports" }
repeaternet-coverage = { path = "../coverage" }
repeaternet-project-store = { path = "../project-store" }
repeaternet-optimizer = { path = "../optimizer" }
repeaternet-rf-core = { path = "../rf-core" }
repeaternet-terrain = { path = "../terrain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tiff-reader = { version = "0.11.1", default-features = false, features = ["zstd"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
