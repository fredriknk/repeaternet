[package]
name = "repeaternet-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Kartverket, Overpass and CoreScope providers for RepeaterNet"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
geo = { version = "0.33.1", default-features = false }
httpdate = "1"
repeaternet-terrain = { path = "../terrain" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots", "system-proxy"] }
rstar = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
unicode-casefold = "0.2"

[dev-dependencies]
url = "2"
