[package]
name = "repeaternet-providers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Kartverket, Overpass and CoreScope providers for RepeaterNet"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs2 = "0.4"
geo = { version = "0.33.1", default-features = false }
httpdate = "1"
repeaternet-terrain = { path = "../terrain" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "form", "query", "rustls-no-provider", "system-proxy"] }
rstar = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
unicode-casefold = "0.2"

[dev-dependencies]
url = "2"
