[package]
name = "sondehub-import"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
flate2 = "1"
httpdate = "1"
png = "0.18"
quick-xml = { version = "0.40", features = ["serialize"] }
repeaternet-providers = { path = "../providers" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "query", "rustls-no-provider", "system-proxy"] }
rusqlite = { version = "0.43", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
