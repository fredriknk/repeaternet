[package]
name = "corescope-capture"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
repeaternet-providers = { path = "../providers" }
getrandom = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
