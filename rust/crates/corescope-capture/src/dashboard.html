<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoreScope capture · {{host}}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/leaflet.css">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #142725; background: #f2f6f4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-size: 14px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; padding: 12px 22px; background: #12302d; color: #fff; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 20px; overflow-wrap: anywhere; }
    h2 { font-size: 15px; }
    #status { font-size: 13px; text-align: right; color: #d3e9e1; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 14px; min-height: calc(100dvh - 52px); }
    .map-panel, aside { background: #fff; border: 1px solid #cfdcd6; border-radius: 10px; overflow: hidden; }
    .map-panel { display: grid; grid-template-rows: auto minmax(320px, 1fr) auto; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; }
    label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
    input, select { min-height: 36px; border: 1px solid #91a8a0; border-radius: 6px; padding: 4px 7px; font: inherit; color: inherit; background: #fff; }
    input { width: 68px; }
    :focus-visible { outline: 3px solid #146da1; outline-offset: 2px; }
    #map { background: #dbeaf0; }
    .legend { border-top: 1px solid #cfdcd6; padding: 9px 12px; }
    .legend p { font-size: 13px; color: #405a54; }
    .legend ul { padding: 0; margin: 7px 0 0; list-style: none; display: flex; flex-wrap: wrap; gap: 5px 14px; font-size: 12px; }
    .legend li { display: inline-flex; align-items: center; gap: 5px; }
    .sample { display: inline-block; width: 18px; border-top: 2px solid var(--band); }
    .strong { --band: #087c48; }
    .good { --band: #006fa8; }
    .marginal { --band: #9c5800; border-top-style: dashed; }
    .weak { --band: #b1303a; border-top-style: dashed; }
    .unknown { --band: #55666a; border-top-style: dotted; }
    .observer, .node { display: inline-block; width: 8px; height: 8px; background: #321768; border: 1px solid #fff; outline: 1px solid #321768; }
    .node { background: #47615b; outline-color: #47615b; border-radius: 50%; }
    .leaflet-marker-icon.observer { box-shadow: 0 0 1px 1px #fff; }
    aside { align-self: start; padding: 14px; }
    dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; margin: 8px 0 0; font-size: 13px; }
    dt, dd { border-bottom: 1px solid #e4ebe7; padding: 7px 0; }
    dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
    .schedule { grid-template-columns: minmax(0, 1fr); }
    .schedule dt { border: 0; padding-bottom: 2px; color: #405a54; }
    .schedule dd { text-align: left; padding-top: 0; overflow-wrap: anywhere; }
    .popup { min-width: 175px; }
    .popup dl { gap: 0 8px; }
    @media (max-width: 700px) {
      header { padding: 9px 12px; }
      h1 { font-size: 17px; }
      main { grid-template-columns: minmax(0, 1fr); padding: 8px; gap: 8px; }
      .map-panel { grid-template-rows: auto max(350px, 44dvh) auto; }
      .filters { gap: 5px 10px; padding: 6px 8px; }
      input, select { min-height: 44px; }
      .leaflet-touch .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
      aside { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>CoreScope capture · {{host}}</h1>
    <p id="status" role="status">Loading capture…</p>
  </header>
  <main>
    <section class="map-panel" aria-label="Measured links">
      <form class="filters" aria-label="Map filters">
        <label>Time window
          <select name="window">
            <option value="day">24 hours</option>
            <option value="week">7 days</option>
            <option value="all">All time</option>
          </select>
        </label>
        <label>Minimum samples <input type="number" name="min_count" min="1" max="4294967295" step="1" value="1" required></label>
        <label>Last hop
          <select name="hops">
            <option value="both">Zero-hop and relayed</option>
            <option value="zero">Zero-hop adverts</option>
            <option value="relayed">Relayed packets</option>
          </select>
        </label>
      </form>
      <div id="map" aria-label="Map of directed radio links"></div>
      <section class="legend" aria-label="Map legend">
        <p><strong>Median SNR · dB</strong> (separate from RepeaterNet margin)</p>
        <ul>
          <li><span class="sample strong"></span> Strong ≥ 5</li>
          <li><span class="sample good"></span> Good 0 to &lt; 5</li>
          <li><span class="sample marginal"></span> Marginal −5 to &lt; 0</li>
          <li><span class="sample weak"></span> Weak &lt; −5</li>
          <li><span class="sample unknown"></span> SNR unavailable</li>
          <li><span class="observer"></span> Observer</li>
          <li><span class="node"></span> Node</li>
        </ul>
      </section>
    </section>
    <aside aria-labelledby="stats-heading">
      <h2 id="stats-heading">Capture totals</h2>
      <dl id="totals"></dl>
      <dl class="schedule" id="schedule"></dl>
    </aside>
  </main>
  <script src="/leaflet.js"></script>
  <script>
    'use strict';
    const map = L.map('map', { preferCanvas: true, zoomSnap: 0.25 }).setView([62.3, 16], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    const links = L.layerGroup().addTo(map);
    const markers = L.layerGroup().addTo(map);
    map.createPane('measured-links').style.zIndex = 450;
    const linkRenderer = L.canvas({ pane: 'measured-links', tolerance: 3 });
    const observerIcon = L.divIcon({ className: 'observer', iconSize: [8, 8] });
    const form = document.querySelector('form');
    const status = document.getElementById('status');
    const number = new Intl.NumberFormat();
    const clock = new Intl.DateTimeFormat(undefined, {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
    });
    const time = seconds => seconds == null ? '—' : clock.format(seconds * 1000);
    const metric = (value, digits, unit) => value == null ? '—' : value.toFixed(digits) + ' ' + unit;
    let request;
    let nextRefresh;
    let fittedBounds = false;
    let fittedLinks = false;

    function definitionList(list, rows) {
      const items = document.createDocumentFragment();
      for (const [label, value] of rows) {
        const term = document.createElement('dt');
        term.textContent = label;
        const detail = document.createElement('dd');
        detail.textContent = value;
        items.append(term, detail);
      }
      list.replaceChildren(items);
    }

    function showStats(stats) {
      const n = value => number.format(value);
      definitionList(document.getElementById('totals'), [
        ['Receptions', n(stats.receptions)], ['Distinct packets', n(stats.packets)],
        ['Directed pairs', n(stats.pairs)], ['Pairs with both ends located', n(stats.located_pairs)],
        ['Pairs inside neighbor bounds', n(stats.bbox_pairs)],
        ['Observers · located / total', n(stats.located_observers) + ' / ' + n(stats.observers)],
        ['Nodes', n(stats.nodes)], ['Requests · last 24 h', n(stats.requests_24h)],
        ['Database size', metric(stats.db_bytes / 1048576, 1, 'MiB')]
      ]);
      const backingOff = stats.backoff_until * 1000 > Date.now();
      definitionList(document.getElementById('schedule'), [
        ['Capture started', time(stats.capture_started)], ['Last successful poll', time(stats.last_poll)],
        ['Next packet poll', time(stats.next_poll)], ['Backoff',
          backingOff ? 'Until ' + time(stats.backoff_until) + ' · ' + stats.backoff_reason : 'None']
      ]);
    }

    function linkStyle(snr) {
      if (snr == null) return { color: '#55666a', dashArray: '1 4' };
      if (snr >= 5) return { color: '#087c48' };
      if (snr >= 0) return { color: '#006fa8' };
      if (snr >= -5) return { color: '#9c5800', dashArray: '6 3' };
      return { color: '#b1303a', dashArray: '3 3' };
    }

    function openDetails(event, title, rows) {
      const content = document.createElement('div');
      content.className = 'popup';
      const heading = document.createElement('strong');
      heading.textContent = title;
      const list = document.createElement('dl');
      definitionList(list, rows);
      content.append(heading, list);
      L.popup().setLatLng(event.latlng).setContent(content).openOn(map);
    }

    function draw({ points, pairs }) {
      links.clearLayers();
      markers.clearLayers();
      for (const [from, to, count, snr, rssi, km, seen] of pairs) {
        const [tx, txLat, txLon] = points[from];
        const [rx, rxLat, rxLon] = points[to];
        L.polyline([[txLat, txLon], [rxLat, rxLon]], {
          ...linkStyle(snr), renderer: linkRenderer, weight: 1.8, opacity: 0.78
        }).on('click', event => openDetails(event, tx + ' → ' + rx, [
          ['Receptions', number.format(count)], ['Median SNR', metric(snr, 1, 'dB')],
          ['Median RSSI', metric(rssi, 1, 'dBm')], ['Distance', metric(km, 2, 'km')],
          ['Last seen', time(seen)]
        ])).addTo(links);
      }
      for (const [name, lat, lon, observer] of points) {
        const marker = observer
          ? L.marker([lat, lon], { icon: observerIcon, title: name, alt: name })
          : L.circleMarker([lat, lon], { radius: 1.6, color: '#47615b', weight: 1, opacity: 0.7, fillOpacity: 0.55 });
        marker.on('click', event => openDetails(event, name, [
          ['Kind', observer ? 'Observer' : 'Node'],
          ['Position', lat.toFixed(6) + ', ' + lon.toFixed(6)]
        ])).addTo(markers);
      }
    }

    async function refresh() {
      clearTimeout(nextRefresh);
      request?.abort();
      if (!form.checkValidity()) {
        status.textContent = 'Enter a positive whole number of samples';
        return;
      }
      const active = new AbortController();
      request = active;
      try {
        const query = new URLSearchParams(new FormData(form));
        const response = await fetch('/api/map?' + query, { signal: active.signal });
        if (!response.ok) throw new Error('Map data unavailable');
        const data = await response.json();
        if (active.signal.aborted) return;
        if (!fittedLinks && data.map.pairs.length) {
          const bounds = L.latLngBounds();
          for (const [from, to] of data.map.pairs) {
            for (const index of [from, to]) {
              const [, lat, lon] = data.map.points[index];
              bounds.extend([lat, lon]);
            }
          }
          map.fitBounds(bounds, { padding: [22, 22], maxZoom: 10, animate: false });
          fittedLinks = true;
          fittedBounds = true;
        } else if (!fittedBounds) {
          const { south, north, west, east } = data.bbox;
          map.fitBounds([[south, west], [north, east]], { padding: [12, 12], maxZoom: 9, animate: false });
          fittedBounds = true;
        }
        draw(data.map);
        showStats(data.stats);
        status.textContent = data.map.pairs.length
          ? number.format(data.map.pairs.length) + ' links shown'
          : data.stats.receptions ? 'No located links match the filters' : 'Waiting for the first packet poll';
      } catch (error) {
        if (!active.signal.aborted) status.textContent = 'Refresh failed · retrying in one minute';
      } finally {
        if (!active.signal.aborted) nextRefresh = setTimeout(refresh, 60_000);
      }
    }
    form.addEventListener('submit', event => { event.preventDefault(); refresh(); });
    form.addEventListener('change', refresh);
    refresh();
  </script>
</body>
</html>
