name: CI and release

# Pull requests run the checks on Windows. Version tags (v*) also build,
# verify and publish the Windows executable as a GitHub release.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Terrain tests without resident window cache
        run: cargo test --locked -p repeaternet-terrain -p repeaternet-coverage
        env:
          RF_PLANNER_TERRAIN_CACHE_MB: "0"
      - name: Dashboard script tests
        working-directory: .
        run: node --test rust/crates/web-server/tests/js/

      - name: Build release executable
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          rustup component add rust-docs
          cargo build --locked --release --target x86_64-pc-windows-msvc -p repeaternet
      - name: Verify and package
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        shell: powershell
        run: |
          $exe = 'rust/target/x86_64-pc-windows-msvc/release/repeaternet.exe'
          $json = & ./tools/verify-rust-release.ps1 -ExePath $exe
          $json | Write-Output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = $json | ConvertFrom-Json
          New-Item -ItemType Directory -Path dist | Out-Null
          ./tools/package-rust-release.ps1 -ExePath $exe -ExpectedSha256 $report.sha256
          $zip = Get-Item dist/repeaternet-windows-x64.zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Out-File dist/SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}" \
            dist/repeaternet-windows-x64.zip dist/SHA256SUMS.txt
